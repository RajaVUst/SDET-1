name: Playwright UI Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TEST_UI_Playwright/package-lock.json

      - name: Create .env
        working-directory: TEST_UI_Playwright
        run: |
          echo "BASE_URL=${{ vars.BASE_URL }}" > .env

      - name: Create secrets.local.env
        working-directory: TEST_UI_Playwright
        run: |
          echo "CARD_NUMBER=${{ secrets.CIPI_CARD_NUMBER }}" > secrets.local.env
          echo "EXPIRY=${{ secrets.CIPI_EXPIRY }}" > secrets.local.env
          echo "CVV=${{ secrets.CIPI_CVV }}" > secrets.local.env


      - name: Install Dependencies
        working-directory: TEST_UI_Playwright
        run: npm ci

      - name: Install Browsers
        working-directory: TEST_UI_Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright Test
        working-directory: TEST_UI_Playwright
        run: npx playwright test 

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: TEST_UI_Playwright/playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Test_UI_Playwright/test-results