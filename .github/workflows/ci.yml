name: Final Capstone Assesment By Practice Team

on:
  push:
    branches: [main,capstone/310919-muhammed-ali]
  pull_request:
    branches: [mainy,capstone/310919-muhammed-ali]

jobs:

  playwright-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: UiTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UiTest/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create Playwright .env
        run: |
          cat > .env << 'EOF'
          MUHAMMED_BASE_URL=${{ secrets.MUHAMMED_BASE_URL }}
          EOF

      - name: Create Playwright Secrets
        run: |
          cat > secrets.local.env << 'EOF'
          MUHAMMED_JANE_PHONENUMBER=${{ secrets.MUHAMMED_JANE_PHONENUMBER }},
          MUHAMMED_JANE_CARDNUMBER=${{ secrets.MUHAMMED_JANE_CARDNUMBER }},
          MUHAMMED_JANE_EXPIRY=${{ secrets.MUHAMMED_JANE_EXPIRY }},
          MUHAMMED_JANE_CVV=${{ secrets.MUHAMMED_JANE_CVV }}
          EOF

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UiTest/playwright-report/
          retention-days: 14

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: UiTest/test-results/
          retention-days: 14
          
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apitesting

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

    
      - name: Create API .env
        run: |
          cat > .env << 'EOF'
          MUHAMMED_API_URL=${{ secrets.MUHAMMED_API_URL }}
          EOF

      - name: Create API Secrets
        run: |
          cat > secrets.local.properties << 'EOF'
          MUHAMMED_PASSWORD=${{ secrets.MUHAMMED_PASSWORD }}
          EOF

      - name: Run API Tests
        run: mvn clean test

      - name: Upload Surefire Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apitesting/target/surefire-reports/
          retention-days: 14
    
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: apitesting/target/allure-results
          allure_report: allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: apitesting/target/allure-results/
          retention-days: 14