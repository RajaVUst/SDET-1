name: UI and API Automation Final

on:
  push:
    branches:
      - George_Final_Assessment
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          NAME: ${{ secrets.GEORGE_NAME }}
          EMAIL: ${{ secrets.GEORGE_EMAIL }}
          PHONE: ${{ secrets.GEORGE_PHONE }}
          SHIPPING_STREET: ${{ secrets.GEORGE_SHIPPING_STREET }}
          SHIPPING_CITY: ${{ secrets.GEORGE_SHIPPING_CITY }}
          SHIPPING_ZIP: ${{ secrets.GEORGE_SHIPPING_ZIP }}
          SHIPPING_STATE: ${{ secrets.GEORGE_SHIPPING_STATE }}
          CARD_NUMBER: ${{ secrets.GEORGE_CARD_NUMBER }}
          EXPIRY: ${{ secrets.GEORGE_EXPIRY }}
          CVV: ${{ secrets.GEORGE_CVV }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UI/playwright-report